name: Fix chat and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch chat participant handling
        if: github.actor != 'github-actions[bot]'
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/tus-market.html')
          s = p.read_text(encoding='utf-8')
          original = s

          s = s.replace(
              "let chatConversationId = null;",
              "let chatConversationId = null;\n  let chatParticipantUids = [];"
          )
          s = s.replace(
              "chatConversationId = `${chatProduct.id}_${[chatProduct.uid, currentUser.uid].sort().join('_')}`;",
              "chatConversationId = `${chatProduct.id}_${[chatProduct.uid, currentUser.uid].sort().join('_')}`;\n    chatParticipantUids = [chatProduct.uid, currentUser.uid];"
          )
          s = s.replace(
              'data-conversation-id="${escapeHtml(latest.conversationId)}" style="display:flex;',
              'data-conversation-id="${escapeHtml(latest.conversationId)}" data-participants="${escapeHtml(JSON.stringify(latest.participantUids || []))}" style="display:flex;'
          )
          s = s.replace(
              "chatConversationId = button.dataset.conversationId;\n          markChatRead(chatConversationId);",
              "chatConversationId = button.dataset.conversationId;\n          try { chatParticipantUids = JSON.parse(button.dataset.participants || '[]'); } catch { chatParticipantUids = []; }\n          if (!Array.isArray(chatParticipantUids) || chatParticipantUids.length !== 2) { chatParticipantUids = [chatProduct.uid, currentUser.uid]; }\n          markChatRead(chatConversationId);"
          )
          s = s.replace(
              "participantUids: [chatProduct.uid, currentUser.uid], text, createdAt: serverTimestamp()",
              "participantUids: chatParticipantUids.length === 2 ? chatParticipantUids : [chatProduct.uid, currentUser.uid], text, createdAt: serverTimestamp()"
          )

          if s != original:
              p.write_text(s, encoding='utf-8')

      - name: Commit source fix
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tus-market.html
          git diff --cached --quiet || git commit -m "Fix chat participant routing"
          git push

      - name: Refresh to latest main after source patch
        if: github.actor != 'github-actions[bot]'
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
