name: Deploy TUS-MARKET to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tus-market-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply production UI and chat fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('public/app.html'); s=p.read_text(encoding='utf-8'); s=s.replace('    *{box-sizing:border-box} body{','    *{box-sizing:border-box} [hidden]{display:none!important} body{',1); s=s.replace('participants=existingParticipants||[p.uid,user.uid];','requested=Array.isArray(existingParticipants)?existingParticipants:[];participants=(requested.length===2&&requested[0]!==requested[1]&&requested.includes(user.uid))?requested:[p.uid,user.uid];',1); s=s.replace(\"if(part.length!==2||part[0]===part[1]||!part.includes(user.uid)){showToast('บทสนทนานี้ไม่มีข้อมูลผู้ร่วมแชตครบ จึงยังเปิดไม่ได้');return}\",\"if(part.length!==2||part[0]===part[1]||!part.includes(user.uid)){part=[p.uid,user.uid]}\",1); p.write_text(s,encoding='utf-8')"

      - name: Validate production files
        shell: bash
        run: |
          set -euo pipefail
          test -f firebase.json
          test -f firestore.rules
          test -f firestore.indexes.json
          test -f public/index.html
          test -f public/app.html
          python3 -c "import json,re,subprocess; from pathlib import Path; source=Path('public/app.html').read_text(encoding='utf-8'); scripts=re.findall(r'<script\\s+type=[\"\\']module[\"\\']>(.*?)</script>',source,re.S); assert len(scripts)==1, f'Expected exactly one module script, found {len(scripts)}'; Path('/tmp/tus-market-app.mjs').write_text(scripts[0],encoding='utf-8'); subprocess.run(['node','--check','/tmp/tus-market-app.mjs'],check=True); json.loads(Path('firebase.json').read_text(encoding='utf-8')); json.loads(Path('firestore.indexes.json').read_text(encoding='utf-8'))"
          git diff --check

      - name: Commit generated production fixes
        shell: bash
        run: |
          if git diff --quiet -- public/app.html; then
            echo "No generated source changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/app.html
            git commit -m "Fix chat routing and logged-out UI [skip ci]"
            git push origin HEAD:main
          fi

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TUS_MARKET }}
          channelId: live
          projectId: tus-market
