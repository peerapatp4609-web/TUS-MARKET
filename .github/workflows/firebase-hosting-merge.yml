name: Deploy TUS-MARKET to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tus-market-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production files
        shell: bash
        run: |
          set -euo pipefail
          test -f firebase.json
          test -f firestore.rules
          test -f firestore.indexes.json
          test -f public/index.html
          test -f public/app.html
          python3 -c 'from pathlib import Path; import json, re; s=Path("public/app.html").read_text(encoding="utf-8"); m=re.findall(r"<script\\s+type=[\"\\x27]module[\"\\x27]>(.*?)</script>",s,re.S); assert len(m)==1, f"Expected exactly one module script, found {len(m)}"; Path("/tmp/tus-market-app.mjs").write_text(m[0],encoding="utf-8"); json.loads(Path("firebase.json").read_text(encoding="utf-8")); json.loads(Path("firestore.indexes.json").read_text(encoding="utf-8"))'
          node --check /tmp/tus-market-app.mjs
          git diff --check

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TUS_MARKET }}
          channelId: live
          projectId: tus-market
