name: Deploy TUS-MARKET to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tus-market-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply production fixes
        shell: bash
        run: python3 .github/scripts/fix-production.py

      - name: Validate production files
        shell: bash
        run: |
          set -euo pipefail
          test -f firebase.json
          test -f firestore.rules
          test -f firestore.indexes.json
          test -f public/index.html
          test -f public/app.html
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess
          source = Path('public/app.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script\s+type=["\']module["\']>(.*?)</script>', source, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected exactly one module script, found {len(scripts)}')
          Path('/tmp/tus-market-app.mjs').write_text(scripts[0], encoding='utf-8')
          subprocess.run(['node', '--check', '/tmp/tus-market-app.mjs'], check=True)
          json.loads(Path('firebase.json').read_text(encoding='utf-8'))
          json.loads(Path('firestore.indexes.json').read_text(encoding='utf-8'))
          PY
          git diff --check

      - name: Commit generated production fixes
        shell: bash
        run: |
          if git diff --quiet -- public/app.html; then
            echo "No generated source changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/app.html
            git commit -m "Fix chat thread routing and logged-out UI [skip ci]"
            git push origin HEAD:main
          fi

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TUS_MARKET }}
          channelId: live
          projectId: tus-market
